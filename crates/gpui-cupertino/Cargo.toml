[package]
name = "gpui-cupertino"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Apple-inspired components, materials, and motion for GPUI."

[[example]]
name = "components"
test = true

[[example]]
name = "detail"
test = true

[[example]]
name = "collections"
test = true

[[bench]]
name = "collections"
harness = false

[[bench]]
name = "backdrop"
harness = false

[lints]
workspace = true

[dependencies]
cupertino = { version = "0.1.0", path = "../cupertino" }
gpui = { version = "0.2.2", path = "../../vendor/crates/gpui" }
unicode-segmentation = "1.13.3"

[dev-dependencies]
anyhow = "1.0.104"
gpui = { path = "../../vendor/crates/gpui", features = ["test-support"] }
gpui_apple = { path = "../../vendor/crates/gpui_apple", features = ["test-support"] }
gpui_platform = { path = "../../vendor/crates/gpui_platform", features = ["font-kit", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
futures = "0.3.34"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSGlassEffectView", "NSImage", "NSImageView", "NSAppearance", "NSColor", "NSControl", "objc2-core-foundation", "NSEvent", "NSGraphics", "NSRunningApplication", "NSCell"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString"] }
